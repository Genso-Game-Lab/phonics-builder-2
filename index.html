<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>フォニックスビルダー2 アドバンス</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background:#0f172a; color:#e2e8f0;
    display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none;
    min-height:100%;
  }
  .wrap { width:min(94vw, 460px); padding:10px 0 24px; }
  header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:10px; }
  h1 { font-size:1.2rem; }
  h1 small { display:block; font-size:.65rem; color:#94a3b8; font-weight:normal; margin-top:2px; }
  .stats { display:flex; gap:6px; }
  .stat { background:#1e293b; border-radius:8px; padding:4px 10px; text-align:center; min-width:60px; }
  .stat .label { font-size:.6rem; color:#94a3b8; }
  .stat .value { font-size:1rem; font-weight:bold; }

  .quest {
    background:#1e293b; border-radius:14px; padding:16px; margin-bottom:10px;
    display:flex; align-items:center; gap:14px;
  }
  .quest .pic { font-size:3.2rem; line-height:1; }
  .quest .info { flex:1; }
  .quest .ja { font-size:1.15rem; font-weight:bold; }
  .quest .rule { font-size:.7rem; color:#7dd3fc; margin-top:4px; }
  .hint-show { font-size:.95rem; color:#facc15; font-weight:bold; margin-top:4px; letter-spacing:.1em; }
  .qbtns { display:flex; flex-direction:column; gap:6px; }
  .qbtns button {
    background:#334155; color:#e2e8f0; border:none; border-radius:8px;
    padding:8px 12px; font-size:.75rem; font-weight:bold; cursor:pointer; white-space:nowrap;
  }
  .qbtns .speakBtn { background:linear-gradient(135deg,#22c55e,#16a34a); font-size:.85rem; }
  .qbtns .speakBtn:active { transform:scale(.95); }

  .build {
    background:#1e293b; border:2px dashed #334155; border-radius:12px;
    min-height:86px; padding:12px; margin-bottom:10px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
  }
  .build.shake { animation:shake .4s; border-color:#ef4444; }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    20%,60% { transform:translateX(-8px); }
    40%,80% { transform:translateX(8px); }
  }
  .build .empty { color:#475569; font-size:.8rem; }
  .slot {
    min-width:52px; height:58px; padding:0 10px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; font-weight:bold; color:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,.4); animation:drop .15s ease; cursor:pointer;
  }
  @keyframes drop { from { transform:scale(0); } }

  .palette { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:12px; }
  .tile {
    min-width:60px; height:62px; padding:0 12px; border:none; border-radius:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; font-weight:bold; color:#fff; box-shadow:0 2px 5px rgba(0,0,0,.4);
  }
  .tile:active { transform:scale(.92); }
  .t-cons  { background:linear-gradient(135deg,#60a5fa,#2563eb); }
  .t-vowel { background:linear-gradient(135deg,#fb923c,#ea580c); }
  .t-team  { background:linear-gradient(135deg,#a78bfa,#7c3aed); }
  .t-magic { background:linear-gradient(135deg,#facc15,#ca8a04); color:#1e293b; }

  .actions { display:flex; gap:10px; }
  .actions button {
    flex:1; border:none; border-radius:12px; padding:14px; font-size:1rem;
    font-weight:bold; cursor:pointer; color:#fff;
  }
  #checkBtn { background:linear-gradient(135deg,#22c55e,#16a34a); }
  #checkBtn:active { transform:scale(.97); }
  #clearBtn { background:#334155; flex:0 0 30%; font-size:.8rem; }

  .legend { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; font-size:.6rem; }
  .legend span { padding:2px 8px; border-radius:99px; color:#fff; }
  .backlink { text-align:center; margin-top:14px; font-size:.7rem; }
  .backlink a { color:#64748b; text-decoration:none; }

  .toast {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(140%);
    background:#1e293b; border:1px solid #334155; border-radius:12px;
    padding:10px 16px; font-size:.8rem; max-width:90vw; text-align:center;
    transition:transform .3s ease; z-index:20; box-shadow:0 4px 16px rgba(0,0,0,.5);
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast b { color:#facc15; }

  .overlay {
    position:fixed; inset:0; background:rgba(15,23,42,.92); z-index:30;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .overlay.show { display:flex; }
  .card {
    background:#1e293b; border-radius:16px; padding:24px; width:min(90vw,380px);
    text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.6); animation:popIn .25s ease;
  }
  @keyframes popIn { from { transform:scale(.7); opacity:0; } }
  .card h2 { font-size:1.5rem; margin-bottom:8px; }
  .card .pic { font-size:3rem; }
  .card .word { font-size:2.2rem; font-weight:bold; color:#facc15; letter-spacing:.06em; margin:4px 0; }
  .card .breakdown { font-size:1rem; color:#7dd3fc; margin-bottom:10px; }
  .card .fun { font-size:.85rem; color:#cbd5e1; background:#0f172a; border-radius:10px; padding:10px; margin-bottom:16px; }
  .card .btns { display:flex; gap:8px; justify-content:center; }
  .card button {
    border:none; border-radius:12px; padding:13px 18px; font-size:.95rem;
    font-weight:bold; cursor:pointer; color:#fff;
  }
  #againBtn, #slowBtn { background:#334155; }
  #nextBtn { background:linear-gradient(135deg,#22c55e,#16a34a); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>フォニックスビルダー2<small>アドバンス編・全30単語に挑戦！</small></h1>
    <div class="stats">
      <div class="stat"><div class="label">ステージ</div><div class="value" id="stage">1</div></div>
      <div class="stat"><div class="label">スコア</div><div class="value" id="score">0</div></div>
    </div>
  </header>

  <div class="quest">
    <div class="pic" id="qPic"></div>
    <div class="info">
      <div class="ja" id="qJa"></div>
      <div class="rule" id="qRule"></div>
      <div class="hint-show" id="hintShow" hidden></div>
    </div>
    <div class="qbtns">
      <button class="speakBtn" id="speakBtn">🔊 きく</button>
      <button id="hintBtn">ヒント💡</button>
    </div>
  </div>

  <div class="build" id="build"></div>

  <div class="palette" id="palette"></div>

  <div class="actions">
    <button id="clearBtn">全部消す</button>
    <button id="checkBtn">✔️ かんせい！</button>
  </div>

  <div class="legend">
    <span class="t-cons">子音</span>
    <span class="t-vowel">母音</span>
    <span class="t-team">チームの音</span>
    <span class="t-magic">マジックe</span>
  </div>
  <div class="backlink"><a href="https://genso-game-lab.github.io/">🧪 ほかのゲームであそぶ</a></div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="winOverlay">
  <div class="card">
    <h2 id="winTitle">⭕ せいかい！</h2>
    <div class="pic" id="winPic"></div>
    <div class="word" id="winWord"></div>
    <div class="breakdown" id="winBreak"></div>
    <div class="fun" id="winFun"></div>
    <div class="btns">
      <button id="againBtn">🔊</button>
      <button id="slowBtn">🐢 ゆっくり</button>
      <button id="nextBtn">つぎへ ▶</button>
    </div>
  </div>
</div>

<script>
"use strict";
const VOWELS = ["a","e","i","o","u"];
const TEAMS = ["sh","ch","th","ng","ck","ai","ee","oa","oo","igh","ar","wh","ay","ou","ow","er","or","oi","oy","ea","ew","ir","ur","qu","ph"];

function tileType(p, isMagic) {
  if (isMagic) return "magic";
  if (TEAMS.includes(p)) return "team";
  if (VOWELS.includes(p)) return "vowel";
  return "cons";
}

// ===== ステージデータ（アドバンス編・全30単語）=====
const LEVELS = [
  // --- 子音ブレンド（子音2つを続けて読む） ---
  { w:"frog",  pic:"🐸", ja:"かえる",     parts:["f","r","o","g"],      decoys:["l","ck"],  rule:"f＋r を続けて「フr」（子音ブレンド）", fun:"子音が2つ並んだら両方読む！fr、gr、bl…これがブレンド" },
  { w:"stop",  pic:"🛑", ja:"とまれ",     parts:["s","t","o","p"],      decoys:["sh","a"],  rule:"s＋t を続けて「スt」", fun:"stop、star、stand…st で始まる単語はたくさんある" },
  { w:"black", pic:"⚫", ja:"くろ",       parts:["b","l","a","ck"],     decoys:["r","k"],   rule:"b＋l のブレンド、最後は ck", fun:"色の名前第1号。blue、brown も bで始まるブレンド仲間" },
  { w:"swim",  pic:"🏊", ja:"およぐ",     parts:["s","w","i","m"],      decoys:["wh","e"],  rule:"s＋w を続けて「スw」", fun:"swim、sweet、swing…sw はくちびるをすぼめて" },
  { w:"drum",  pic:"🥁", ja:"たいこ",     parts:["d","r","u","m"],      decoys:["t","o"],   rule:"d＋r を続けて「ドゥr」", fun:"drum、dream、drive…dr の音は「ジュ」に聞こえることも" },
  { w:"milk",  pic:"🥛", ja:"ぎゅうにゅう", parts:["m","i","l","k"],    decoys:["ck","e"],  rule:"最後は l＋k のブレンド", fun:"単語の最後にもブレンドはある。milk、desk、help" },
  // --- 母音チーム（応用） ---
  { w:"day",   pic:"📅", ja:"1日・日",    parts:["d","ay"],             decoys:["ai","e"],  rule:"ay は「エイ」（単語のさいごに使う）", fun:"ai と同じ音だけど、単語のおわりでは ay を使うのがルール！" },
  { w:"play",  pic:"🎮", ja:"あそぶ",     parts:["p","l","ay"],         decoys:["ai","r"],  rule:"ブレンド pl ＋ ay「エイ」", fun:"play、say、way…「〜エイ」で終わる単語は ay" },
  { w:"cow",   pic:"🐄", ja:"うし",       parts:["c","ow"],             decoys:["ou","a"],  rule:"ow は「アウ」", fun:"cow、how、now…口を大きく開けて「アウ」" },
  { w:"mouth", pic:"👄", ja:"くち",       parts:["m","ou","th"],        decoys:["ow","t"],  rule:"ou も「アウ」", fun:"ou と ow は同じ「アウ」。mouth、house、out" },
  { w:"coin",  pic:"🪙", ja:"コイン",     parts:["c","oi","n"],         decoys:["oy","o"],  rule:"oi は「オイ」", fun:"coin、oil、point…単語のまんなかでは oi" },
  { w:"boy",   pic:"👦", ja:"おとこのこ", parts:["b","oy"],             decoys:["oi","i"],  rule:"oy も「オイ」（単語のさいご用）", fun:"oi と oy も音は同じ。おわりに来るなら oy！boy、toy、enjoy" },
  { w:"tea",   pic:"🍵", ja:"おちゃ",     parts:["t","ea"],             decoys:["ee","e"],  rule:"ea は「イー」", fun:"tea、eat、sea…ee と同じ「イー」と読む別チーム" },
  { w:"read",  pic:"📖", ja:"よむ",       parts:["r","ea","d"],         decoys:["ee","i"],  rule:"ea は「イー」", fun:"read=リード。本をたくさん read しよう" },
  { w:"snow",  pic:"⛄", ja:"ゆき",       parts:["s","n","ow"],         decoys:["oa","o"],  rule:"ow は「オウ」とも読む！", fun:"cowの「アウ」とは別読み。snow、grow、show は「オウ」。英語あるあるの2刀流" },
  { w:"new",   pic:"✨", ja:"あたらしい", parts:["n","ew"],             decoys:["oo","u"],  rule:"ew は「ュー」", fun:"new、few、flew…ew は「ニュー」の「ュー」" },
  // --- r のついた母音（あいまいアー） ---
  { w:"bird",  pic:"🐦", ja:"とり",       parts:["b","ir","d"],         decoys:["er","i"],  rule:"ir は「アー」（口をあまり開けない）", fun:"bird、girl、first…ir は日本語にない「あいまいアー」" },
  { w:"girl",  pic:"👧", ja:"おんなのこ", parts:["g","ir","l"],         decoys:["ur","r"],  rule:"ir は「アー」", fun:"girl=ガール…じゃなくて「グァーl」が近い！" },
  { w:"corn",  pic:"🌽", ja:"とうもろこし", parts:["c","or","n"],       decoys:["ar","o"],  rule:"or は「オー」", fun:"corn、fork、sport…or は口を丸くして「オー」" },
  { w:"surf",  pic:"🏄", ja:"サーフィン", parts:["s","ur","f"],         decoys:["ir","er"], rule:"ur も「アー」", fun:"ir、ur、er はぜんぶ同じ「あいまいアー」3兄弟" },
  // --- マジックe（ブレンドと合体） ---
  { w:"snake", pic:"🐍", ja:"へび",       parts:["s","n","a","k","e"],  decoys:["ai","c"],  rule:"ブレンド sn ＋ マジックe", fun:"sn＋ake。マジックe が a を「エイ」に！snake=スネイク", magicE:true },
  { w:"plane", pic:"✈️", ja:"ひこうき",   parts:["p","l","a","n","e"],  decoys:["ay","i"],  rule:"pl ＋ マジックe で「プレイン」", fun:"plane、place、plate…pl 始まりのマジックe 単語", magicE:true },
  { w:"smile", pic:"😊", ja:"えがお",     parts:["s","m","i","l","e"],  decoys:["igh","a"], rule:"マジックe で i が「アイ」", fun:"smile=スマイル。キミの smile で家族も smile", magicE:true },
  { w:"stone", pic:"🪨", ja:"いし",       parts:["s","t","o","n","e"],  decoys:["oa","u"],  rule:"マジックe で o が「オウ」", fun:"stone、stove、store…st＋マジックe コンビ", magicE:true },
  // --- 上級のチーム音 ---
  { w:"queen", pic:"👸", ja:"じょおう",   parts:["qu","ee","n"],        decoys:["k","w"],   rule:"qu は2文字で「クヮ」", fun:"q はほぼ必ず u とセットで使う。queen、quiz、quick" },
  { w:"phone", pic:"📱", ja:"でんわ",     parts:["ph","o","n","e"],     decoys:["f","oa"],  rule:"ph は「フ」！＋マジックe", fun:"ph は f と同じ音。phone、photo…ギリシャ語から来た単語に多い", magicE:true },
  { w:"whale", pic:"🐋", ja:"くじら",     parts:["wh","a","l","e"],     decoys:["w","ai"],  rule:"wh は「ゥワ」＋マジックe", fun:"whale、white、why…wh の h はほとんど聞こえない", magicE:true },
  { w:"light", pic:"💡", ja:"ひかり",     parts:["l","igh","t"],        decoys:["i","ai"],  rule:"igh は3文字で「アイ」", fun:"light、night、right…gh は読まないのに居座る不思議トリオ" },
  { w:"school",pic:"🏫", ja:"がっこう",   parts:["s","ch","oo","l"],    decoys:["sh","k"],  rule:"この ch は例外で「ク」！", fun:"chは普通「チ」だけど、school、chorus は「ク」。例外も覚えたら強い" },
  { w:"dream", pic:"💭", ja:"ゆめ",       parts:["d","r","ea","m"],     decoys:["ee","i"],  rule:"dr ブレンド ＋ ea「イー」", fun:"dream=ドリーム。最終ステージクリア、おめでとう！Follow your dreams!" },
];

// ===== 状態 =====
let saved = {};
try { saved = JSON.parse(localStorage.getItem("phonicsBuilder2") || "{}"); } catch (e) {}
let lv = Math.min(saved.lv || 0, LEVELS.length - 1);
let score = saved.score || 0;
let seq = [];
let hintUsed = false;
let finished = false;

const buildEl = document.getElementById("build");
const toastEl = document.getElementById("toast");

function save() {
  localStorage.setItem("phonicsBuilder2", JSON.stringify({ lv, score }));
}

function speak(text, rate) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate || 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang.startsWith("en"));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function startLevel() {
  seq = []; hintUsed = false;
  const L = LEVELS[lv];
  document.getElementById("stage").textContent = (lv + 1) + "/" + LEVELS.length;
  document.getElementById("score").textContent = score;
  document.getElementById("qPic").textContent = L.pic;
  document.getElementById("qJa").textContent = L.ja;
  document.getElementById("qRule").textContent = "📘 " + L.rule;
  document.getElementById("hintShow").hidden = true;
  const tiles = [...new Set([...L.parts, ...L.decoys])];
  tiles.sort(() => Math.random() - 0.5);
  const pal = document.getElementById("palette");
  pal.innerHTML = "";
  for (const p of tiles) {
    const isMagic = !!L.magicE && p === "e" && L.parts[L.parts.length - 1] === "e";
    const b = document.createElement("button");
    b.className = "tile t-" + tileType(p, isMagic);
    b.textContent = p;
    b.addEventListener("click", () => addPart(p));
    pal.appendChild(b);
  }
  renderBuild();
}

function addPart(p) {
  if (seq.length >= 8) return;
  seq.push(p);
  renderBuild();
}

function removePart(i) {
  seq.splice(i, 1);
  renderBuild();
}

function renderBuild() {
  const L = LEVELS[lv];
  buildEl.innerHTML = "";
  if (!seq.length) {
    buildEl.innerHTML = `<div class="empty">下のパーツを順番にタップして単語を作ろう（🔊で音をきける）</div>`;
    return;
  }
  seq.forEach((p, i) => {
    const isMagic = !!L.magicE && p === "e" && i === seq.length - 1;
    const d = document.createElement("div");
    d.className = "slot t-" + tileType(p, isMagic);
    d.textContent = p;
    d.addEventListener("click", () => removePart(i));
    buildEl.appendChild(d);
  });
}

function arraysEqual(a, b) {
  return a.length === b.length && a.every((x, i) => x === b[i]);
}

function check() {
  const L = LEVELS[lv];
  if (!seq.length) { toast("まずはパーツを入れよう！🔊でお手本をきいてね"); return; }
  if (arraysEqual(seq, L.parts)) {
    const pts = hintUsed ? 50 : 100;
    score += pts;
    save();
    document.getElementById("score").textContent = score;
    speak(L.w);
    document.getElementById("winTitle").textContent = "⭕ せいかい！ +" + pts;
    document.getElementById("winPic").textContent = L.pic;
    document.getElementById("winWord").textContent = L.w;
    document.getElementById("winBreak").textContent = L.parts.join(" ＋ ") + " → " + L.w;
    document.getElementById("winFun").textContent = "💡 " + L.fun;
    document.getElementById("nextBtn").textContent =
      lv + 1 < LEVELS.length ? "つぎへ ▶" : "けっか発表 🏆";
    document.getElementById("winOverlay").classList.add("show");
    return;
  }
  buildEl.classList.remove("shake");
  void buildEl.offsetWidth;
  buildEl.classList.add("shake");
  const sortedA = [...seq].sort().join("|"), sortedB = [...L.parts].sort().join("|");
  if (sortedA === sortedB) {
    toast("音はぜんぶ合ってる！<b>ならべる順番</b>をかえてみよう");
  } else if (seq.length !== L.parts.length) {
    toast(`この単語は<b>音${L.parts.length}個</b>でできているよ。🔊でもういちど聞いてみよう`);
  } else {
    toast("ちがう音がまざっているかも。🔊でもういちど聞いてみよう");
  }
}

function next() {
  if (finished) {
    finished = false;
    lv = 0; score = 0;
    save();
    document.getElementById("winOverlay").classList.remove("show");
    startLevel();
    return;
  }
  if (lv + 1 < LEVELS.length) {
    document.getElementById("winOverlay").classList.remove("show");
    lv++;
    save();
    startLevel();
  } else {
    finished = true;
    document.getElementById("winTitle").textContent = "👑 全ステージクリア！";
    document.getElementById("winPic").textContent = "🎓";
    document.getElementById("winWord").textContent = score + "点";
    document.getElementById("winBreak").textContent = "";
    document.getElementById("winFun").textContent = score >= LEVELS.length * 100 ? "💡 ノーヒント全問クリア！キミはフォニックスの達人！" : "💡 もう一度あそぶとスコアを伸ばせるよ";
    document.getElementById("nextBtn").textContent = "さいしょから 🔁";
  }
}

let toastTimer;
function toast(html) {
  toastEl.innerHTML = html;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3000);
}

document.getElementById("speakBtn").addEventListener("click", () => speak(LEVELS[lv].w));
document.getElementById("checkBtn").addEventListener("click", check);
document.getElementById("clearBtn").addEventListener("click", () => { seq = []; renderBuild(); });
document.getElementById("hintBtn").addEventListener("click", () => {
  hintUsed = true;
  const hs = document.getElementById("hintShow");
  hs.hidden = false;
  hs.textContent = "ヒント： " + LEVELS[lv].w;
});
document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("againBtn").addEventListener("click", () => speak(LEVELS[lv].w));
document.getElementById("slowBtn").addEventListener("click", () => speak(LEVELS[lv].w, 0.4));

if (window.speechSynthesis) speechSynthesis.getVoices();

startLevel();
</script>
</body>
</html>
